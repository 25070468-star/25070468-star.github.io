<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dates in Month</title>

    <script>
        function isLeapYear(y) {
            return (y % 4 == 0 && y % 100 != 0) || (y % 400 == 0);
        }

        function update() {

            var year = document.f.year;
            var month = document.f.month;
            var date = document.f.date;

            if (year.value == "" || isNaN(year.value)) {
                date.value = "year must a number";
                year.focus();
                return;
            }

            switch (month.value) {

                case "1":
                case "3":
                case "5":
                case "7":
                case "8":
                case "10":
                case "12":
                    date.value = 31;
                    break;

                case "4":
                case "6":
                case "9":
                case "11":
                    date.value = 30;
                    break;

                case "2":
                    if (isLeapYear(year.value)) {
                        date.value = 29;
                    } else {
                        date.value = 28;
                    }
                    break;
            }
        }
    </script>
</head>

<body onload="update()">

<form name="f">

<table border="1" align="center" cellpadding="10">

    <tr>
        <td colspan="2" align="center">
            <h2>DATES IN MONTH</h2>
        </td>
    </tr>

    <tr>
        <td>Year:</td>
        <td>
            <input type="text"
                   name="year"
                   value="2014"
                   onblur="update()">
        </td>
    </tr>

    <tr>
        <td>Month:</td>
        <td>
            <select name="month" onchange="update()">

                <option value="1">01</option>
                <option value="2">02</option>
                <option value="3">03</option>
                <option value="4">04</option>
                <option value="5">05</option>
                <option value="6">06</option>
                <option value="7">07</option>
                <option value="8">08</option>
                <option value="9">09</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>

            </select>
        </td>
    </tr>

    <!-- Date -->
    <tr>
        <td>Date:</td>
        <td>
            <input type="text"
                   name="date"
                   readonly>
        </td>
    </tr>

</table>

</form>

</body>
</html>
